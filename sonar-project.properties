# SonarCloud (SonarQube) scanner configuration for @vibexp/design-system.
#
# CI-based analysis (see .github/workflows/ci-sonar.yml), NOT SonarCloud
# Automatic Analysis: we want Vitest coverage ingested, which Automatic
# Analysis cannot do. The two modes are mutually exclusive, so Automatic
# Analysis must be turned OFF for this project in the SonarCloud UI or CI
# analysis is rejected (issue #2).

sonar.organization=vibexp
sonar.projectKey=vibexp_design-system

# --- Sources & tests ---
# src/ holds both the shipped TypeScript primitives and their colocated
# *.test.tsx; test.inclusions classifies the tests so the rest are analyzed
# as main sources (a file is never indexed as both).
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# --- Coverage report ---
# Vitest (v8 provider) writes lcov to coverage/lcov.info with SF: paths
# relative to the repo root, so the scanner resolves them directly.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# --- Exclusions: build output and non-source files are neither analyzed nor
# counted toward coverage. dist/** is the tsup build artifact (gitignored,
# never committed); stories are prototyping scaffolding. ---
sonar.exclusions=dist/**,**/*.test.*,**/*.spec.*,**/*.stories.*
sonar.coverage.exclusions=**/*.test.*,**/*.spec.*,**/*.stories.*
