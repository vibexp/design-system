name: CI / SonarCloud

# Non-blocking SonarCloud (SonarQube) static analysis for @vibexp/design-system
# (issue #2). Builds Vitest coverage, then runs the SonarScanner against org
# `vibexp` / project `vibexp_design-system` (config in the repo-root
# sonar-project.properties). The scan step is `continue-on-error: true` so a
# failing Quality Gate surfaces findings without blocking PRs or `main` while
# the existing debt is burned down.
#
# NOTE: CI-based analysis is mutually exclusive with SonarCloud Automatic
# Analysis. Automatic Analysis must be disabled for `vibexp_design-system` in
# the SonarCloud UI (Administration -> Analysis Method) or the scan is rejected.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - 'sonar-project.properties'
      - '.github/workflows/ci-sonar.yml'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.ts'
      - 'sonar-project.properties'
      - '.github/workflows/ci-sonar.yml'

permissions:
  contents: read

jobs:
  sonar:
    name: Coverage & Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          # Full history so SonarCloud can attribute new code / blame accurately.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Emits coverage/lcov.info (v8 provider); same script developers run
      # locally, so CI and local runs stay identical.
      - name: Test with coverage
        run: npm run test:coverage

      # Fail loudly here rather than let Sonar silently ingest 0% coverage if
      # the report is missing.
      - name: Verify coverage report exists
        run: test -s coverage/lcov.info || { echo "::error::coverage/lcov.info missing or empty"; exit 1; }

      # Non-blocking: a red Quality Gate must not fail the workflow or block
      # merges while existing findings are progressively fixed.
      - name: SonarCloud scan
        continue-on-error: true
        uses: sonarsource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f  # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
